name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . coverage build
      - run: coverage run --source=reelish -m unittest discover -s tests -v
      - run: coverage report -m --fail-under=85
      - run: python -m build
      - run: pip install --force-reinstall dist/*.whl
      - run: reelish --version
